name: Release

# Merging to main is the publish action. The version in PowerScan.ps1 decides
# whether anything happens: if its tag already exists this is a no-op, so only
# a merge that bumps $PowerScanVersion ships a release.
#
# Tagging and publishing deliberately live in the same job. A tag pushed with
# GITHUB_TOKEN does not trigger other workflows, so "tag here, release on the
# tag event" would silently never run.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # Windows, not Linux: PowerScan reads the ARP table and calls WPF, so the
    # only smoke test worth running is one on the platform it ships to.
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # need the full tag list to tell new from old

      # Asking the script for its version beats grepping for the variable: one
      # source of truth, and it proves -Version works as a side effect.
      - name: Read version and decide whether to release
        id: check
        run: |
          $version = (& pwsh -NoProfile -File ./PowerScan.ps1 -Version | Out-String).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
              throw "PowerScan.ps1 reported '$version', which is not MAJOR.MINOR.PATCH."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

          if (git tag -l "v$version") {
              Write-Host "::notice::v$version is already released - nothing to do."
              "release=false" >> $env:GITHUB_OUTPUT
          }
          else {
              Write-Host "::notice::v$version is new - releasing."
              "release=true" >> $env:GITHUB_OUTPUT
          }

      - name: Check the script parses
        if: steps.check.outputs.release == 'true'
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
              "$PWD/PowerScan.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) {
              foreach ($e in $errors) {
                  Write-Host "::error file=PowerScan.ps1,line=$($e.Extent.StartLineNumber)::$($e.Message)"
              }
              throw "PowerScan.ps1 has $($errors.Count) parse error(s); refusing to release."
          }
          Write-Host 'Parsed clean.'

      - name: Smoke-test the console path
        if: steps.check.outputs.release == 'true'
        run: |
          # Loopback is the only address guaranteed to answer on a runner.
          & pwsh -NoProfile -File ./PowerScan.ps1 -NoGui -Range 127.0.0.1
          if ($LASTEXITCODE -ne 0) { throw "Console scan exited $LASTEXITCODE." }

      - name: Smoke-test the one-liner path
        if: steps.check.outputs.release == 'true'
        run: |
          # How technicians actually invoke it: compiled from text, with no
          # $PSCommandPath and parameters bound through the scriptblock.
          $source = Get-Content ./PowerScan.ps1 -Raw
          & ([scriptblock]::Create($source)) -NoGui -Range 127.0.0.1 -OfflineVendors
          exit 0   # see the step below: $LASTEXITCODE decides the step result

      - name: Smoke-test the RMM exit codes
        if: steps.check.outputs.release == 'true'
        run: |
          # -SetExitCode is the contract an RMM agent reads; a release that got
          # this backwards would report every scan as failed, or every failure
          # as success.
          & pwsh -NoProfile -File ./PowerScan.ps1 -NoGui -Range 127.0.0.1 -SetExitCode
          $good = $LASTEXITCODE
          if ($good -ne 0) { throw "Good scan exited $good, expected 0." }

          & pwsh -NoProfile -File ./PowerScan.ps1 -NoGui -Range not.an.ip -SetExitCode
          $bad = $LASTEXITCODE
          if ($bad -ne 1) { throw "Bad range exited $bad, expected 1." }

          Write-Host 'Exit codes correct: 0 on success, 1 on failure.'

          # A pwsh step exits with whatever $LASTEXITCODE holds, and the line
          # above deliberately left it at 1. Without this the step fails even
          # though both assertions passed.
          exit 0

      - name: Tag and publish
        if: steps.check.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.check.outputs.version }}"
          gh release create $tag PowerScan.ps1 `
            --title "PowerScan $tag" `
            --target $env:GITHUB_SHA `
            --generate-notes
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed with $LASTEXITCODE." }
          Write-Host "::notice::Published $tag - scanner.meritit.us now serves it."
